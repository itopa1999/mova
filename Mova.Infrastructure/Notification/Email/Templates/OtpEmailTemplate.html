<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>MOVA · Verify your email</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ─── Reset ─────────────────────────────────────── */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ─── Brand tokens (mirrors src/index.css) ──────── */
    :root {
      --mova-green: #1B6B3A;
      --mova-green-mid: #25A05A;
      --mova-green-bright: #2BB673;
      --mova-green-light: #E8F5EE;
      --mova-green-soft: #F3FAF6;

      --mova-charcoal: #111827;
      --mova-mid: #6B7280;
      --mova-light: #9CA3AF;

      --mova-border: #E8EAED;
      --mova-background: #F7F8FA;
      --mova-card: #FFFFFF;
    }

    /* ─── Base ──────────────────────────────────────── */
    html, body {
      height: 100%;
    }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--mova-background);
      color: var(--mova-charcoal);
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ─── Container ─────────────────────────────────── */
    .container {
      max-width: 540px;
      width: 100%;
      background: var(--mova-card);
      border-radius: 24px;
      box-shadow:
        0 1px 3px rgba(17, 24, 39, 0.04),
        0 12px 32px rgba(17, 24, 39, 0.06);
      overflow: hidden;
      border: 1px solid var(--mova-border);
    }

    /* ─── Header ────────────────────────────────────── */
    .header {
      background: linear-gradient(135deg, #2BB673 0%, #25A05A 55%, #1B6B3A 100%);
      padding: 32px 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Soft radial glow to give the header depth */
    .header::before {
      content: '';
      position: absolute;
      inset: -40% -10% auto -10%;
      height: 200%;
      background: radial-gradient(
        ellipse at center top,
        rgba(255, 255, 255, 0.22) 0%,
        rgba(255, 255, 255, 0.06) 40%,
        transparent 70%
      );
      pointer-events: none;
    }

    /* Subtle diagonal sheen for a polished feel */
    .header::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        120deg,
        rgba(255, 255, 255, 0.14) 0%,
        rgba(255, 255, 255, 0) 45%,
        rgba(255, 255, 255, 0.08) 100%
      );
      pointer-events: none;
    }

    .header .brand-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.2);
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
      position: relative;
      z-index: 1;
    }

    .header .brand-icon img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ─── Body ──────────────────────────────────────── */
    .body {
      padding: 36px 32px 32px;
    }

    .greeting {
      font-size: 20px;
      color: var(--mova-charcoal);
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .greeting .name {
      color: var(--mova-green);
    }

    .message {
      color: var(--mova-mid);
      font-size: 15px;
      line-height: 1.65;
      margin-bottom: 28px;
    }

    /* ─── OTP box ───────────────────────────────────── */
    .otp-box {
      background: var(--mova-green-soft);
      border-radius: 18px;
      padding: 28px 20px 24px;
      text-align: center;
      border: 1px solid var(--mova-green-light);
      margin: 0 0 28px;
      position: relative;
    }

    .otp-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--mova-mid);
      margin-bottom: 14px;
    }

    .otp-code {
      display: inline-block;
      font-family: 'DM Mono', 'Courier New', monospace;
      font-size: 40px;
      font-weight: 700;
      letter-spacing: 14px;
      color: var(--mova-green);
      background: #FFFFFF;
      padding: 14px 22px 14px 34px;
      border-radius: 14px;
      box-shadow: 0 1px 3px rgba(15, 81, 50, 0.06);
      border: 1px solid var(--mova-green-light);
      line-height: 1;
    }

    .expiry-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 18px;
      font-size: 13px;
      color: var(--mova-mid);
    }

    .expiry-note svg {
      flex-shrink: 0;
      color: var(--mova-green);
    }

    .expiry-note strong {
      color: var(--mova-green);
      font-weight: 600;
    }

    /* ─── Divider ───────────────────────────────────── */
    .divider {
      height: 1px;
      background: var(--mova-border);
      margin: 28px 0 24px;
    }

    /* ─── Footer notes ──────────────────────────────── */
    .footer-note {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      color: var(--mova-mid);
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 4px;
    }

    .footer-note svg {
      flex-shrink: 0;
      margin-top: 2px;
      color: var(--mova-light);
    }

    .footer-note a {
      color: var(--mova-green);
      text-decoration: none;
      font-weight: 500;
      border-bottom: 1px solid rgba(27, 107, 58, 0.25);
      transition: border-color 200ms ease;
    }

    .footer-note a:hover {
      border-bottom-color: var(--mova-green);
    }

    /* ─── Signature ─────────────────────────────────── */
    .signature {
      margin-top: 24px;
      color: var(--mova-mid);
      font-size: 14px;
      line-height: 1.6;
    }

    .signature strong {
      color: var(--mova-charcoal);
      font-weight: 600;
    }

    /* ─── Responsive ────────────────────────────────── */
    @media (max-width: 480px) {
      body { padding: 20px 12px; }

      .container { border-radius: 20px; }

      .header { padding: 26px 20px; }
      .header .brand-icon { width: 48px; height: 48px; }

      .body { padding: 28px 22px 24px; }

      .greeting { font-size: 18px; }
      .message { font-size: 14px; }

      .otp-box { padding: 22px 16px 20px; }
      .otp-code {
        font-size: 32px;
        letter-spacing: 10px;
        padding: 12px 16px 12px 26px;
      }
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- HEADER — logo only -->
    <div class="header">
      <div class="brand-icon">
        <img
          src="https://res.cloudinary.com/et0r3out/image/upload/v1789426234/9.png"
          alt="MOVA"
        >
      </div>
    </div>

    <!-- BODY -->
    <div class="body">

      <p class="greeting">
        Hello <span class="name">{Name}</span>,
      </p>

      <p class="message">
        {message}
      </p>

      <!-- OTP CODE -->
      <div class="otp-box">
        <span class="otp-label">Your verification code</span>

        <div class="otp-code">{OTP}</div>

        <div class="expiry-note">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
          <span>Expires in <strong>{Expiry}</strong></span>
        </div>
      </div>

      <!-- SECURITY NOTE -->
      <p class="footer-note">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <span>
          If you didn&rsquo;t request this code, please ignore this email or
          <a href="#">contact support</a>.
        </span>
      </p>

      <div class="divider"></div>

      <div class="signature">
        Regards,<br>
        <strong>MOVA Security Team</strong>
      </div>

    </div>

  </div>

</body>
</html>
